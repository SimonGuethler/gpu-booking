name: gpu-booking

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gpu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpu}
      POSTGRES_DB: ${POSTGRES_DB:-gpu_booking}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gpu} -d ${POSTGRES_DB:-gpu_booking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gpu}:${POSTGRES_PASSWORD:-gpu}@postgres:5432/${POSTGRES_DB:-gpu_booking}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss gesetzt sein (z. B. `openssl rand -hex 32`)}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-90}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      MAX_BOOKING_DAYS: ${MAX_BOOKING_DAYS:-7}
      SEED_ADMIN_DISPLAY_NAME: ${SEED_ADMIN_DISPLAY_NAME:-Admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD muss gesetzt sein (erstes Admin-Login)}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pgdata:
